version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      timezone: America/Los_Angeles
      day: tuesday
    target-branch: "main"
    open-pull-requests-limit: 99
    groups:
      composer-security:
        applies-to: security-updates
        update-types:
        - minor
        - patch
      composer-minor-patch:
        applies-to: version-updates
        update-types:
        - minor
        - patch
    ignore:
    - dependency-name: phpunit/phpunit
      versions:
      - ">= 8.a"
      - "< 9"
    - dependency-name: phpunit/phpunit
      versions:
      - ">= 9.a"
      - "< 10"
  - package-ecosystem: npm
    directory: "/tests/playwright"
    schedule:
      interval: weekly
      timezone: America/Los_Angeles
      day: tuesday
    target-branch: "main"
    open-pull-requests-limit: 99
    groups:
      # These three must move together; a version mismatch breaks playwright-bdd's loader.
      playwright:
        patterns:
        - "@playwright/test"
        - playwright
        - playwright-bdd
      e2e-minor-patch:
        update-types:
        - minor
        - patch
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    groups:
      github-actions-security:
        applies-to: security-updates
        update-types:
        - minor
        - patch
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
        - minor
        - patch