name: Rename Dependabot PRs

on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  rename:
    name: Rename
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Rename by update type
        # TODO(SITE-5827): placeholder ref, pin to a main SHA once
        # pantheon-systems/plugin-release-actions#40 is merged and tagged.
        uses: pantheon-systems/plugin-release-actions/rename-dependabot-pr@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
