name: Build, Tag, and Release
on:
  push:
    branches:
      - 'release'

permissions:
  pull-requests: write
  contents: write

jobs:
  tag:
    name: Tag and Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build, tag, and release
      uses: pantheon-systems/plugin-release-actions/build-tag-release@ec0ee6ce8ee49452580d6bfe906ac47bc8527269 # v0.5.7
      with:
        gh_token: ${{ secrets.GITHUB_TOKEN }}
        generate_release_notes: "true"
        draft: "true"